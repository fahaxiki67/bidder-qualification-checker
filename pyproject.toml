[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bidder-qualification-checker"
version = "0.1.0"
description = "投标人资格智能核查系统 — 把官方公开数据与项目资格审查条款对应起来，形成可追溯的资格前审证据链"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bqc = "app.main:main"

[tool.setuptools]
packages = { include = ["app", "app.core"] }
