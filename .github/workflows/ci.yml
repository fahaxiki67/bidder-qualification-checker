name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (项目装不上时必须失败，禁止单独装 pytest 兜底)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Dependency sanity check
        run: python -m pip check
      - name: Installed-package smoke test
        run: python scripts/smoke_installed.py
      - name: CLI smoke test
        run: python -m app.main --help
      - name: Test
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Artifacts exist
        shell: bash
        run: |
          ls -la dist/
          test -n "$(ls dist/*.whl 2>/dev/null)" || { echo "wheel 缺失"; exit 1; }
          test -n "$(ls dist/*.tar.gz 2>/dev/null)" || { echo "sdist 缺失"; exit 1; }
      - name: Wheel -> isolated venv -> smoke (脱离源码目录运行)
        shell: bash
        run: |
          python -m venv .venv-wheel
          .venv-wheel/bin/python -m pip install --upgrade pip
          .venv-wheel/bin/python -m pip install dist/*.whl
          .venv-wheel/bin/python -m pip check
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.venv-wheel/bin/python" -m app.main --help
          "$GITHUB_WORKSPACE/.venv-wheel/bin/bqc" --version
          "$GITHUB_WORKSPACE/.venv-wheel/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_installed.py"
      - name: Sdist -> isolated venv -> smoke (证明 sdist 自包含)
        shell: bash
        run: |
          python -m venv .venv-sdist
          .venv-sdist/bin/python -m pip install --upgrade pip
          .venv-sdist/bin/python -m pip install dist/*.tar.gz
          .venv-sdist/bin/python -m pip check
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.venv-sdist/bin/python" -m app.main --help
          "$GITHUB_WORKSPACE/.venv-sdist/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_installed.py"

  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller
      - name: Build exe (PyInstaller onefile)
        run: pyinstaller bqc.spec --noconfirm
      - name: Smoke frozen exe (含 %LOCALAPPDATA% 数据目录验证)
        shell: pwsh
        run: |
          dist\bqc.exe --version
          dist\bqc.exe --help *> $null
          New-Item -ItemType Directory -Force -Path smoke-cwd | Out-Null
          Push-Location smoke-cwd
          ..\dist\bqc.exe init-db
          Pop-Location
          $db = Join-Path $env:LOCALAPPDATA "bqc\data\bqc.sqlite3"
          if (-not (Test-Path $db)) { Write-Error "frozen 数据目录未落在 LOCALAPPDATA: $db"; exit 1 }
          Write-Host "frozen init-db OK: $db"
      - name: Package zip (exe + 启动脚本)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item dist\bqc.exe stage\
          Copy-Item scripts\start_server.bat stage\
          Compress-Archive -Path stage\* -DestinationPath bqc-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: bqc-windows-x64
          path: bqc-windows-x64.zip
          retention-days: 14
