[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bidder-qualification-checker"
version = "0.23.0"
description = "投标审查器 — 投标人资格智能核查与多投标文件离线风险预警"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "PyYAML>=6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "reportlab>=4",
    "pypdf>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "build>=1.2"]
# P3R 门户侦察为人工一次性工具：playwright 体积大、需另行下载浏览器内核，
# 单独成组，不进 dev（CI 三平台装 dev 必须保持快），也不进运行时依赖
recon = ["playwright>=1.40", "PyYAML>=6"]

[project.scripts]
bqc = "app.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app" = ["config/*.yaml"]
"app.web" = ["templates/*.html"]
